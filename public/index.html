<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preuves EP</title>
<style>
:root{--bg:#f5f6f4;--card:#fff;--ink:#14213d;--mut:#5b6478;--line:#dde1e7;--acc:#0b5fff;--ok:#1b8a5a;--warn:#c27803;--bad:#c62839;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#10141c;--card:#181e29;--ink:#e8ecf3;--mut:#9aa4b8;--line:#2a3242;--acc:#6c9bff;--ok:#43c08a;--warn:#e5a53a;--bad:#ef6676;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1}main{max-width:980px;margin:0 auto;padding:20px}
button,input,select,textarea{font:inherit;color:inherit}button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}button.ok{background:var(--ok)}button.bad{background:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mut{color:var(--mut);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok)}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid currentColor}.pending{color:var(--mut)}.submitted{color:var(--warn)}.validated{color:var(--ok)}.rejected,.late{color:var(--bad)}
h2{font-size:15px;margin:22px 0 8px}.stats{display:flex;gap:10px}.stats div{flex:1}.stats b{font-size:24px;display:block}
.chk{display:flex;gap:8px;align-items:center;margin:2px 0;font-size:14px}.chk input{width:auto}.cur{cursor:pointer}.err{color:var(--bad);margin-top:8px}
nav a{cursor:pointer;margin-right:12px;color:var(--mut)}nav a.on{color:var(--ink);font-weight:600}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
.steps{display:flex;gap:6px;margin:6px 0}.steps div{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px}.steps .now{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);font-weight:600}
.bar.two i{float:left}.bar i.b{background:var(--warn)}.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}.kpi .card{margin:0}.kpi b{font-size:26px;display:block;line-height:1.1}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={token:localStorage.t,user:JSON.parse(localStorage.u||'null'),view:JSON.parse(localStorage.u||'{}').role==='tl'?'dash':'list',id:null,err:''};
const api=async(p,o={})=>{const h={Authorization:'Bearer '+S.token};let b=o.body;if(b&&!(b instanceof FormData)){h['Content-Type']='application/json';b=JSON.stringify(b)}
 const r=await fetch('/api'+p,{method:o.method||'GET',headers:h,body:b});const d=await r.json().catch(()=>({}));if(r.status===401&&S.token){logout();return}if(!r.ok)throw new Error(d.error||'Erreur');return d};
const logout=()=>{localStorage.clear();S.token=S.user=null;render()};
const fr=d=>d?new Date(d+'T00:00:00Z').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}):'—';
const ST={pending:'À déposer',submitted:'À valider',validated:'Validée',rejected:'Rejetée'};
const PH=['Approbation','Réalisation','Fin'];
const bar=(a,b,t)=>`<div class="bar" title="${a} validées, ${b} à valider sur ${t}"><i style="width:${t?100*a/t:0}%"></i><i class="b" style="width:${t?100*b/t:0}%"></i></div>`;
const stepper=e=>`<div class="steps">${PH.map(f=>{const p=e.byPhase[f];return`<div class="${e.phase===f?'now':''}">${f}${e.phase===f?' (en cours)':''}<div class="mut">${p.deposited}/${p.total} déposées${p.missing?` · ${p.missing} manquantes`:' · complet'}${p.late?` · <span class="late">${p.late} en retard</span>`:''}</div></div>`}).join('')}</div>`;
const go=(v,id)=>{S.view=v;S.id=id;S.err='';render()};
async function render(){const a=$('#app');
 if(!S.token){a.innerHTML=`<main style="max-width:360px"><h1>Preuves EP</h1><p class="mut">Connecte-toi pour suivre les preuves des EP.</p><label>Email</label><input id="e" value="tl.igv@demo.tn"><label>Mot de passe</label><input id="p" type="password" value="demo"><p><button id="go">Se connecter</button></p><div class="err">${S.err}</div><p class="mut">Démo : tl.igv@demo.tn, tl.igt@demo.tn, buddy@demo.tn (mot de passe : demo)</p></main>`;
  $('#go').onclick=async()=>{try{const d=await api('/login',{method:'POST',body:{email:$('#e').value,password:$('#p').value}});S.token=d.token;S.user=d.user;localStorage.t=d.token;localStorage.u=JSON.stringify(d.user);S.view=d.user.role==='tl'?'dash':'list';render()}catch(e){S.err=e.message;render()}};return}
 const tl=S.user.role==='tl',nt=await api('/notifications'),unread=nt.filter(n=>!n.is_read).length;
 a.innerHTML=`<header><h1>Preuves EP ${tl?'· '+S.user.program:''}</h1><nav>${tl?`<a class="${S.view=='dash'?'on':''}" onclick="go('dash')">Tableau de bord</a>`:''}<a class="${S.view=='list'?'on':''}" onclick="go('list')">Dossiers</a>${tl?`<a class="${S.view=='rules'?'on':''}" onclick="go('rules')">Règles</a><a class="${S.view=='buddies'?'on':''}" onclick="go('buddies')">Buddies</a>`:''}<a class="${S.view=='notifs'?'on':''}" onclick="go('notifs')">Notifications${unread?' ('+unread+')':''}</a></nav><span class="mut">${esc(S.user.name)}</span><button class="g" onclick="logout()">Quitter</button></header><main id="m"></main>`;
 try{await({dash:vDash,list:vList,ep:vEP,new:vNew,rules:vRules,buddies:vBuddies,notifs:()=>vNotifs(nt)}[S.view])()}catch(e){$('#m').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
async function vList(){const[eps,d]=await Promise.all([api('/eps'),api('/digest')]),tl=S.user.role==='tl';
 $('#m').innerHTML=`<div class="card stats"><div><b>${d.toValidate}</b><span class="mut">preuves à valider</span></div><div><b>${d.tomorrow}</b><span class="mut">deadlines demain</span></div><div><b class="${d.late?'late':''}">${d.late}</b><span class="mut">en retard</span></div></div>
 <div class="row"><h2 class="sp">${eps.length} EP</h2>${tl?'<button onclick="go(\'new\')">Nouvel EP</button>':''}</div>
 ${eps.map(e=>`<div class="card cur" onclick="go('ep',${e.id})"><div class="row"><b class="sp">${esc(e.name)}</b>${e.late?`<span class="tag late">${e.late} en retard</span>`:''}${e.submitted?`<span class="tag submitted">${e.submitted} à valider</span>`:''}</div>
 <div class="mut">Arrivée ${fr(e.arrival_date)} · Fin ${fr(e.end_date)} · Buddy : ${esc(e.buddy||'non affecté')}</div><div class="mut">Phase en cours : <b>${e.phase}</b></div>${bar(e.validated,e.submitted,e.total)}
 <div class="mut" style="margin-top:6px">${e.deposited} déposées · ${e.missing} non déposées · ${e.validated} validées${e.next?` · Prochaine : ${esc(e.next.name)}, ${fr(e.next.deadline)}`:''}</div></div>`).join('')||'<p class="mut">Aucun EP pour le moment.</p>'}`}
async function vDash(){const d=await api('/dashboard'),row=r=>`<tr class="cur" onclick="go('ep',${r.ep_id})"><td>${esc(r.ep)}</td><td>${esc(r.proof)}</td><td>${fr(r.deadline)}</td><td>${esc(r.buddy||'—')}</td></tr>`;
 $('#m').innerHTML=`<div class="row"><h2 class="sp" style="font-size:20px">Tableau de bord ${S.user.program}</h2><input id="wv" placeholder="Nom de la wave d’audit (optionnel)" style="width:260px"><button onclick="exportXlsx()">Exporter en Excel (avec les fichiers)</button></div>
 <div class="kpi"><div class="card"><b>${d.eps}</b><span class="mut">EP suivis</span></div><div class="card"><b>${d.deposited}/${d.total}</b><span class="mut">preuves déposées</span></div><div class="card"><b>${d.missing}</b><span class="mut">non déposées</span></div><div class="card"><b>${d.toValidate}</b><span class="mut">à valider</span></div><div class="card"><b class="${d.late?'late':''}">${d.late}</b><span class="mut">en retard</span></div></div>
 <div class="card"><b>Répartition des EP par phase</b><div class="steps">${PH.map(f=>`<div>${f}<div style="font-size:22px;font-weight:600">${d.phases[f]}</div></div>`).join('')}</div>${bar(d.validated,d.toValidate,d.total)}<div class="mut">${d.validated} validées, ${d.toValidate} à valider, ${d.rejected} rejetées, sur ${d.total}</div></div>
 <h2>En retard (${d.lateList.length})</h2><div class="card">${d.lateList.length?`<table><tr><th>EP</th><th>Preuve</th><th>Deadline</th><th>Buddy</th></tr>${d.lateList.map(row).join('')}</table>`:'<span class="mut">Aucun retard.</span>'}</div>
 <h2>Deadlines des 7 prochains jours (${d.upcoming.length})</h2><div class="card">${d.upcoming.length?`<table><tr><th>EP</th><th>Preuve</th><th>Deadline</th><th>Buddy</th></tr>${d.upcoming.map(row).join('')}</table>`:'<span class="mut">Rien cette semaine.</span>'}</div>
 <h2>Par buddy</h2><div class="card"><table><tr><th>Buddy</th><th>EP</th><th>Non déposées</th><th>En retard</th></tr>${Object.entries(d.buddies).map(([k,b])=>`<tr><td>${esc(k)}</td><td>${b.eps}</td><td>${b.missing}</td><td class="${b.late?'late':''}">${b.late}</td></tr>`).join('')}</table></div>
 <h2>Tous les EP</h2><div class="card"><table><tr><th>EP</th><th>Phase</th><th>Déposées</th><th>Non déposées</th><th>Validées</th><th>Retard</th></tr>${d.list.map(e=>`<tr class="cur" onclick="go('ep',${e.id})"><td>${esc(e.name)}</td><td>${e.phase}</td><td>${e.deposited}/${e.total}</td><td>${e.missing}</td><td>${e.validated}</td><td class="${e.late?'late':''}">${e.late}</td></tr>`).join('')}</table></div>`}
function exportXlsx(){location.href='/api/export.xlsx?t='+S.token+'&wave='+encodeURIComponent($('#wv').value)}
async function vNew(){const bs=await api('/buddies'),igv=S.user.program==='IGV';
 $('#m').innerHTML=`<h2>Nouvel EP</h2><div class="card"><label>Nom</label><input id="n"><label>ID EXPA (optionnel)</label><input id="x"><div class="grid"><div><label>Date d’approbation (APD)</label><input id="ap" type="date"></div><div><label>Date d’arrivée en Tunisie</label><input id="ar" type="date"></div>
 <div>${igv?`<label>Durée</label><select id="d"><option value="4">4 semaines</option><option value="6">6 semaines</option></select>`:`<label>Durée en semaines (saisie manuelle)</label><input id="d" type="number" min="1" value="8">`}</div></div>
 <label>Buddy</label><select id="b"><option value="">Plus tard</option>${bs.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select><p><button id="s">Créer le dossier</button> <button class="g" onclick="go('list')">Annuler</button></p><div class="err" id="er"></div></div>`;
 $('#s').onclick=async()=>{try{await api('/eps',{method:'POST',body:{name:$('#n').value,expa_id:$('#x').value,approval_date:$('#ap').value,arrival_date:$('#ar').value,duration_weeks:$('#d').value,buddy_id:+$('#b').value||null}});go('list')}catch(e){$('#er').textContent=e.message}}}
async function vEP(){const{ep,proofs}=await api('/eps/'+S.id),tl=S.user.role==='tl',bs=tl?await api('/buddies'):[];
 const ph=['Approbation','Réalisation','Fin'];
 $('#m').innerHTML=`<a class="mut cur" onclick="go('list')">← Dossiers</a><h2 style="font-size:20px">${esc(ep.name)}</h2>
 <div class="kpi"><div class="card"><b>${ep.phase}</b><span class="mut">phase en cours</span></div><div class="card"><b>${ep.deposited}/${ep.total}</b><span class="mut">preuves déposées</span></div><div class="card"><b>${ep.missing}</b><span class="mut">non déposées</span></div><div class="card"><b>${ep.validated}</b><span class="mut">validées</span></div><div class="card"><b class="${ep.late?'late':''}">${ep.late}</b><span class="mut">en retard</span></div></div>
 <div class="card">${stepper(ep)}${bar(ep.validated,ep.submitted,ep.total)}<div class="mut">Barre : vert validées, orange à valider. ${ep.rejected?ep.rejected+' rejetée(s) à redéposer. ':''}${ep.next?'Prochaine deadline : '+esc(ep.next.name)+', '+fr(ep.next.deadline):''}</div></div>
 ${tl?`<div class="card"><div class="grid"><div><label>Date d’approbation</label><input type="date" id="ap" value="${ep.approval_date}"></div><div><label>Date d’arrivée</label><input type="date" id="ar" value="${ep.arrival_date}"></div><div><label>Durée (semaines)</label><input type="number" id="du" value="${ep.duration_weeks||''}"></div><div><label>Buddy</label><select id="bu"><option value="">—</option>${bs.map(b=>`<option value="${b.id}" ${b.id==ep.buddy_id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div></div><p><button id="sv">Enregistrer et recalculer les deadlines</button></p></div>`:`<p class="mut">Arrivée ${fr(ep.arrival_date)} · Fin ${fr(ep.end_date)}</p>`}
 ${ph.map(f=>`<h2>${f}</h2>`+proofs.filter(p=>p.phase===f).map(p=>`<div class="card"><div class="row"><b class="sp">${esc(p.name)}</b><span class="mut">Deadline ${fr(p.deadline)}</span><span class="tag ${p.late?'late':p.status}">${p.late?'En retard':ST[p.status]}</span></div>
 ${p.files.map((f,i)=>`<div class="mut"><a href="/api/proofs/${p.id}/file/${i}?t=${S.token}" target="_blank">Fichier ${i+1}</a></div>`).join('')}${p.auto.map(x=>`<div class="mut">Info : ${esc(x)}</div>`).join('')}${p.note?`<div class="err">Motif : ${esc(p.note)}</div>`:''}
 ${tl&&p.status==='submitted'?`<div class="row" style="margin-top:8px"><input id="nt${p.id}" placeholder="Motif (obligatoire si rejet)"><button class="ok" onclick="rev(${p.id},'validated')">Valider</button><button class="bad" onclick="rev(${p.id},'rejected')">Rejeter</button></div>`:''}
 ${p.status!=='validated'&&p.status!=='submitted'||(!tl&&p.status==='submitted')?`<details style="margin-top:8px"><summary class="cur mut">${p.status==='submitted'?'Remplacer le dépôt':'Déposer cette preuve'} (${p.formats})</summary><div id="up${p.id}">${p.criteria.map(c=>`<label class="chk"><input type="checkbox" class="c${p.id}"> ${esc(c)}</label>`).join('')}<input type="file" id="f${p.id}" multiple accept="${p.formats.split(',').map(x=>'.'+x)}"><p><button onclick="send(${p.id})">Envoyer</button></p><div class="err" id="e${p.id}"></div></div></details>`:''}</div>`).join('')).join('')}`;
 if(tl)$('#sv').onclick=async()=>{try{await api('/eps/'+S.id,{method:'PUT',body:{approval_date:$('#ap').value,arrival_date:$('#ar').value,duration_weeks:+$('#du').value||null,buddy_id:+$('#bu').value||null}});render()}catch(e){alert(e.message)}}}
async function rev(id,decision){try{await api('/proofs/'+id+'/review',{method:'POST',body:{decision,note:$('#nt'+id).value}});render()}catch(e){alert(e.message)}}
async function send(id){const fd=new FormData();[...$('#f'+id).files].forEach(f=>fd.append('files',f));fd.append('checks',JSON.stringify([...document.querySelectorAll('.c'+id)].map(c=>c.checked)));
 try{await api('/proofs/'+id+'/upload',{method:'POST',body:fd});render()}catch(e){$('#e'+id).textContent=e.message}}
async function vRules(){const ts=await api('/proof-types');
 $('#m').innerHTML=`<h2>Règles des preuves</h2><p class="mut">Modifie la guideline sans développeur : les deadlines de tous les EP se recalculent aussitôt.</p><div class="card"><table><tr><th>Preuve</th><th>Phase</th><th>Point de départ</th><th>Jours (− avant, + après)</th><th>Formats</th><th></th></tr>
 ${ts.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.phase}</td><td><select id="a${t.id}">${[['arrival','Arrivée'],['approval','Approbation'],['end','Fin']].map(([v,l])=>`<option value="${v}" ${t.anchor==v?'selected':''}>${l}</option>`)}</select></td><td><input id="o${t.id}" type="number" value="${t.offset_days}" style="width:80px"></td><td><input id="fm${t.id}" value="${t.formats}"></td><td><button onclick='saveRule(${t.id},${JSON.stringify(t.criteria)},${t.expected_pages||0})'>OK</button></td></tr>`).join('')}</table></div>`}
async function saveRule(id,c,pg){await api('/proof-types/'+id,{method:'PUT',body:{anchor:$('#a'+id).value,offset_days:$('#o'+id).value,formats:$('#fm'+id).value,criteria:c,expected_pages:pg}});alert('Règle enregistrée')}
async function vBuddies(){const bs=await api('/buddies');$('#m').innerHTML=`<h2>Buddies</h2><div class="card">${bs.map(b=>`<div>${esc(b.name)} <span class="mut">${esc(b.email)}</span></div>`).join('')}</div><div class="card"><label>Nom</label><input id="bn"><label>Email</label><input id="be"><label>Mot de passe</label><input id="bp" value="demo"><p><button id="ba">Ajouter le buddy</button></p><div class="err" id="er"></div></div>`;
 $('#ba').onclick=async()=>{try{await api('/buddies',{method:'POST',body:{name:$('#bn').value,email:$('#be').value,password:$('#bp').value}});render()}catch(e){$('#er').textContent=e.message}}}
async function vNotifs(nt){$('#m').innerHTML=`<h2>Notifications</h2>${nt.map(n=>`<div class="card cur" onclick="${n.ep_id?`go('ep',${n.ep_id})`:''}" style="${n.is_read?'opacity:.6':''}">${esc(n.msg)}<div class="mut">${esc(n.created_at)}</div></div>`).join('')||'<p class="mut">Rien de nouveau.</p>'}`;await api('/notifications/read',{method:'POST'})}
render();
</script></body></html>
